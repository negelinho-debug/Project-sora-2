name: Build Project Sora 2 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # ==========================================================
      # CREATE PROJECT
      # ==========================================================

      - name: Create Project Sora 2
        run: |
          set -e

          rm -rf ProjectSora2
          mkdir -p ProjectSora2

          cat > project.yml <<'EOF'
          name: ProjectSora2

          options:
            deploymentTarget:
              iOS: "15.0"

          targets:
            ProjectSora2:
              type: application
              platform: iOS

              sources:
                - path: ProjectSora2

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.projectsora2.app
                  PRODUCT_NAME: "Sora 2"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"

                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: "Sora 2"
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
          EOF

          cat > ProjectSora2/ProjectSora2App.swift <<'EOF'
          import SwiftUI

          @main
          struct ProjectSora2App: App {
              var body: some Scene {
                  WindowGroup {
                      RootView()
                  }
              }
          }
          EOF

          cat > ProjectSora2/RootView.swift <<'EOF'
          import SwiftUI

          struct RootView: View {

              @State private var started = false

              var body: some View {
                  ZStack {

                      StarBackground()

                      if started {
                          GeneratorView()
                      } else {
                          StartView {
                              withAnimation(.easeInOut(duration: 0.25)) {
                                  started = true
                              }
                          }
                      }
                  }
                  .preferredColorScheme(.dark)
              }
          }


          struct StartView: View {

              let start: () -> Void

              var body: some View {

                  VStack {

                      Spacer()

                      CloudLogo()
                          .frame(width: 150, height: 130)

                      Text("Sora 2")
                          .font(
                              .system(
                                  size: 58,
                                  weight: .semibold,
                                  design: .rounded
                              )
                          )
                          .foregroundColor(.white)
                          .padding(.top, 15)

                      Text("Project Sora 2")
                          .font(.system(size: 17))
                          .foregroundColor(
                              .white.opacity(0.55)
                          )
                          .padding(.top, 4)

                      Spacer()

                      Button(action: start) {

                          Text("Начать")
                              .font(
                                  .system(
                                      size: 22,
                                      weight: .semibold
                                  )
                              )
                              .foregroundColor(.black)
                              .frame(maxWidth: .infinity)
                              .frame(height: 64)
                              .background(Color.white)
                              .clipShape(Capsule())
                      }
                      .padding(.horizontal, 30)
                      .padding(.bottom, 45)
                  }
              }
          }


          struct GeneratorView: View {

              var body: some View {

                  VStack(spacing: 18) {

                      Spacer()

                      CloudLogo()
                          .frame(width: 105, height: 90)

                      Text("Sora 2")
                          .font(
                              .system(
                                  size: 40,
                                  weight: .semibold,
                                  design: .rounded
                              )
                          )
                          .foregroundColor(.white)

                      Text("Генератор")
                          .font(.system(size: 21))
                          .foregroundColor(
                              .white.opacity(0.75)
                          )

                      Text("Первый тест Project Sora 2")
                          .font(.system(size: 15))
                          .foregroundColor(
                              .white.opacity(0.45)
                          )

                      Spacer()
                  }
              }
          }


          struct CloudLogo: View {

              var body: some View {

                  ZStack {

                      RoundedRectangle(
                          cornerRadius: 45,
                          style: .continuous
                      )
                      .fill(
                          LinearGradient(
                              colors: [
                                  Color.white,
                                  Color(
                                      red: 0.42,
                                      green: 0.72,
                                      blue: 1.0
                                  )
                              ],
                              startPoint: .top,
                              endPoint: .bottom
                          )
                      )
                      .frame(
                          width: 128,
                          height: 88
                      )

                      Circle()
                          .fill(Color.white)
                          .frame(
                              width: 65,
                              height: 65
                          )
                          .offset(
                              x: -29,
                              y: -18
                          )

                      Circle()
                          .fill(Color.white)
                          .frame(
                              width: 72,
                              height: 72
                          )
                          .offset(
                              x: 18,
                              y: -22
                          )

                      HStack(spacing: 17) {

                          Eye()

                          Eye()
                      }
                      .offset(y: 5)
                  }
                  .shadow(
                      color: .black.opacity(0.25),
                      radius: 14,
                      y: 7
                  )
              }
          }


          struct Eye: View {

              var body: some View {

                  ZStack {

                      Capsule()
                          .fill(
                              Color(
                                  red: 0.01,
                                  green: 0.06,
                                  blue: 0.13
                              )
                          )
                          .frame(
                              width: 28,
                              height: 44
                          )

                      Image(systemName: "sparkle")
                          .font(
                              .system(
                                  size: 12,
                                  weight: .bold
                              )
                          )
                          .foregroundColor(.white)
                          .offset(
                              x: -2,
                              y: -5
                          )
                  }
              }
          }


          struct StarBackground: View {

              let stars: [(Double, Double, Double)] = [

                  (0.08,0.08,2),
                  (0.18,0.16,1),
                  (0.31,0.10,2),
                  (0.46,0.21,1),
                  (0.62,0.09,2),
                  (0.82,0.15,1),

                  (0.11,0.33,1),
                  (0.27,0.29,2),
                  (0.44,0.35,1),
                  (0.72,0.31,2),
                  (0.91,0.38,1),

                  (0.06,0.52,2),
                  (0.22,0.61,1),
                  (0.40,0.55,2),
                  (0.63,0.64,1),
                  (0.84,0.56,2),

                  (0.13,0.79,2),
                  (0.32,0.84,1),
                  (0.56,0.76,2),
                  (0.79,0.87,1),
                  (0.94,0.74,2)
              ]

              var body: some View {

                  GeometryReader { geometry in

                      ZStack {

                          LinearGradient(
                              colors: [

                                  Color(
                                      red: 0.002,
                                      green: 0.035,
                                      blue: 0.09
                                  ),

                                  Color(
                                      red: 0.01,
                                      green: 0.09,
                                      blue: 0.18
                                  ),

                                  Color(
                                      red: 0.002,
                                      green: 0.025,
                                      blue: 0.06
                                  )
                              ],
                              startPoint: .top,
                              endPoint: .bottom
                          )

                          ForEach(
                              0..<stars.count,
                              id: \.self
                          ) { index in

                              Circle()
                                  .fill(
                                      Color.white.opacity(0.75)
                                  )
                                  .frame(
                                      width: stars[index].2,
                                      height: stars[index].2
                                  )
                                  .position(

                                      x:
                                          geometry.size.width
                                          * stars[index].0,

                                      y:
                                          geometry.size.height
                                          * stars[index].1
                                  )
                          }
                      }
                  }
                  .ignoresSafeArea()
              }
          }
          EOF

          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f | sort

      # ==========================================================
      # GENERATE XCODE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        run: |
          set -e

          echo "===== PROJECT.YML ====="
          cat project.yml

          xcodegen generate

          echo "===== XCODE PROJECT ====="
          find . -maxdepth 2 -name "*.xcodeproj" -print

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail

          xcodebuild \
            -project ProjectSora2.xcodeproj \
            -scheme ProjectSora2 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild.log

      # ==========================================================
      # IPA
      # ==========================================================

      - name: Create unsigned IPA
        run: |
          set -euo pipefail

          APP="$(
            find \
              "$PWD/DerivedData/Build/Products/Release-iphoneos" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              | head -1
          )"

          echo "APP=$APP"

          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          rm -rf Payload output

          mkdir -p Payload
          mkdir -p output

          cp -R "$APP" Payload/

          /usr/bin/zip \
            -qry \
            output/Project-Sora-2-v0.4.ipa \
            Payload

          echo "===== TEST IPA ====="

          unzip \
            -t \
            output/Project-Sora-2-v0.4.ipa

          echo "===== IPA ====="

          ls \
            -lh \
            output/Project-Sora-2-v0.4.ipa

      # ==========================================================
      # DOWNLOAD
      # ==========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4

        with:
          name: Project-Sora-2-v0.4-IPA
          path: output/Project-Sora-2-v0.4.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload log if failed
        if: failure()
        uses: actions/upload-artifact@v4

        with:
          name: Sora-2-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
