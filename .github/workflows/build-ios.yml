PROJECT SORA 2 — v0.8

1. СТАРТ
- Тёмно-синий звёздный фон.
- По центру большая нормальная иконка Sora 2 с облаком.
- Под ней название “Sora 2”.
- Внизу одна большая белая кнопка “Старт”.
- Никаких Apple/Google логинов.

2. ПЕРВЫЙ ЗАПУСК
После нажатия “Старт”:
- если аккаунта ещё нет → экран “Создать аккаунт”;
- выбрать ник;
- создать локальный профиль;
- профиль должен сохраняться после закрытия приложения;
- второй раз регистрацию не показывать.

3. ГЛАВНАЯ
Интерфейс вертикальной видеоленты:
- сверху “Подписки” / “Для вас”;
- видео на весь экран;
- справа лайк, комментарии, сохранить, поделиться;
- снизу ник автора и описание;
- свайп вверх/вниз между роликами.

Нижнее меню:
Главная | Обзор | + | Ачивки | Профиль

Все разделы должны реально переключаться.

4. КНОПКА +
Открывает “Создать видео”.

Экран:
- большое поле “Описание нового видео…”;
- выбор фото;
- Cameo;
- длительность 5 / 10 секунд;
- формат 9:16 / 16:9 / 1:1;
- 720p / 1080p;
- стиль;
- кнопка “Создать”.

Не делать просто неподвижную картинку.
Созданное задание должно появляться в “Мои видео”.

Подготовить архитектуру для будущего backend/API:
POST prompt + image + duration + ratio + quality
→ job ID
→ статус генерации
→ готовый MP4.

5. ПРОФИЛЬ
- аватар;
- @nickname;
- количество созданных видео;
- ачивки;
- коллекция иконок;
- “Мои видео”;
- настройки.

НЕ ПОКАЗЫВАТЬ КРЕДИТЫ.
В Project Sora 2 нет системы кредитов.

6. АЧИВКИ
Примеры:

“Первое видео”
Создать 1 видео.
Награда: Night Icon.

“Режиссёр”
Создать 10 видео.
Награда: Gold Icon.

“Image to Video”
Первый раз использовать фотографию.

“Sora Master”
Создать 25 видео.

Ачивки должны храниться локально и не сбрасываться после перезапуска.

7. EVENT ИКОНКИ

ВАЖНО:

Обычные иконки можно открыть обычными ачивками.

Но специальные event-иконки можно ПОЛУЧИТЬ ТОЛЬКО во время соответствующего события.

🎃 Halloween
Доступ получения только во время Halloween Event.

🎄 New Year
Доступ получения только во время New Year Event.

❤️ Valentine
Только во время Valentine Event.

🎂 Anniversary
Только во время Anniversary Event.

Если пользователь открыл event-иконку во время события:
ОНА ОСТАЁТСЯ У НЕГО НАВСЕГДА.

После окончания события её всё равно можно выбирать в коллекции.

Если пользователь не получил её во время события:
она остаётся закрытой до следующего события.

Сохранять полученные event-иконки через UserDefaults.

8. ИКОНКИ ПРИЛОЖЕНИЯ
Использовать iOS Alternate App Icons.

В профиле:
“Иконки приложения”

Показывать:
- Original
- Night
- Gold
- Halloween
- New Year
- Valentine
- Anniversary

Заблокированные иконки показывать с 🔒.

После разблокировки пользователь может менять иконку приложения прямо из Sora 2.

9. ОБЗОР
Добавить стили:
- Cinematic
- Realistic
- Anime
- VHS
- Horror
- Game Trailer
- Meme
- Music Video

Добавить блок активного события.

10. СОБЫТИЯ
Во время события менять:
- оформление;
- баннер;
- специальные ачивки;
- event icon;
- небольшие пасхалки.

Не удалять полученные награды после окончания события.

11. ДИЗАЙН
Не делать обычный стандартный SwiftUI-прототип.

Стиль:
- чёрный / тёмно-синий;
- плавные прозрачные панели;
- большие скругления;
- интерфейс похож по удобству на современную вертикальную видеоленту;
- анимации открытия экранов;
- нормальный полноэкранный интерфейс iPhone.

12. СОХРАНЕНИЕ
UserDefaults:
- профиль;
- ник;
- количество созданных видео;
- ачивки;
- разблокированные обычные иконки;
- НАВСЕГДА разблокированные event icons;
- выбранная иконка;
- настройки.

Ничего из этого не должно исчезать после перезапуска приложения.

13. ИКОНКА
Использовать большую Sora 2 cloud icon.
Не повторять баг, когда облачко было микроскопическим.
Иконка должна занимать почти всю площадь 1024×1024.

14. ВЕРСИЯ
Project Sora 2
Version 0.8
Build: Near Final
