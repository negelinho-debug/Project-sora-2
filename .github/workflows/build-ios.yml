          SWIFT

          cat > /tmp/sora_icon.b64 <<'ICON'
          
          ICON

          tr -d '[:space:]' < /tmp/sora_icon.b64 | base64 --decode > /tmp/sora_icon.jpg

          python3 <<'PY'
          from PIL import Image, ImageEnhance, ImageDraw
          from pathlib import Path

          src = Image.open("/tmp/sora_icon.jpg").convert("RGB")

          # Primary icon, full-size (fixes the tiny-icon bug).
          primary = src.resize((1024, 1024), Image.Resampling.LANCZOS)
          primary.save("ProjectSora2/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")

          # Preview used inside the app.
          primary.resize((320, 320), Image.Resampling.LANCZOS).save(
              "ProjectSora2/Resources/AppIconPreview.png"
          )

          # Night variant.
          night = ImageEnhance.Brightness(primary).enhance(0.42)
          night = ImageEnhance.Contrast(night).enhance(1.18)

          # Gold variant.
          gold = primary.convert("RGBA")
          overlay = Image.new("RGBA", gold.size, (255, 172, 35, 82))
          gold = Image.alpha_composite(gold, overlay).convert("RGB")

          # Santa event variant.
          santa = primary.convert("RGBA")
          draw = ImageDraw.Draw(santa)
          draw.polygon(
              [(370, 245), (555, 60), (720, 290)],
              fill=(205, 28, 42, 255)
          )
          draw.rounded_rectangle(
              (330, 235, 735, 330),
              radius=45,
              fill=(250, 250, 250, 255)
          )
          draw.ellipse(
              (675, 72, 775, 172),
              fill=(250, 250, 250, 255)
          )
          santa = santa.convert("RGB")

          variants = {
              "NightIcon": night,
              "GoldIcon": gold,
              "SantaIcon": santa,
          }

          for name, im in variants.items():
              im.resize((120, 120), Image.Resampling.LANCZOS).save(
                  f"ProjectSora2/Resources/{name}@2x.png"
              )
              im.resize((180, 180), Image.Resampling.LANCZOS).save(
                  f"ProjectSora2/Resources/{name}@3x.png"
              )
              im.resize((320, 320), Image.Resampling.LANCZOS).save(
                  f"ProjectSora2/Resources/{name}Preview.png"
              )
          PY

          cat > ProjectSora2/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          cat > ProjectSora2/Assets.xcassets/Contents.json <<'JSON'
          {
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          echo "===== CREATED FILES ====="
          find ProjectSora2 -maxdepth 4 -type f -print | sort

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project ProjectSora2.xcodeproj -list

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail

          xcodebuild \
            -project ProjectSora2.xcodeproj \
            -scheme ProjectSora2 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild.log

      - name: Create IPA
        run: |
          set -euo pipefail

          APP="$(find "$PWD/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: built .app not found"
            exit 1
          fi

          rm -rf Payload output
          mkdir -p Payload output
          cp -R "$APP" Payload/

          /usr/bin/zip -qry output/Project-Sora-2-v0.7-Near-Final.ipa Payload

          unzip -t output/Project-Sora-2-v0.7-Near-Final.ipa
          ls -lh output/Project-Sora-2-v0.7-Near-Final.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Project-Sora-2-v0.7-Near-Final-IPA
          path: output/Project-Sora-2-v0.7-Near-Final.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Project-Sora-2-v0.7-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
