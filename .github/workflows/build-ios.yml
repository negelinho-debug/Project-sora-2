name: Build Project Sora 2 v0.7 Near Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          brew install xcodegen
          python3 -m pip install --user pillow
          xcodegen --version

      - name: Create Project Sora 2
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ProjectSora2 ProjectSora2.xcodeproj DerivedData Payload output
          mkdir -p ProjectSora2/Resources
          mkdir -p ProjectSora2/Assets.xcassets/AppIcon.appiconset

          cat > project.yml <<'PROJECTYML'
          name: ProjectSora2

          options:
            deploymentTarget:
              iOS: "16.0"

          targets:
            ProjectSora2:
              type: application
              platform: iOS

              sources:
                - path: ProjectSora2
                  excludes:
                    - Resources

              resources:
                - path: ProjectSora2/Resources

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.projectsora2.nearfinal
                  PRODUCT_NAME: "Sora 2"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
                  INFOPLIST_FILE: ProjectSora2/Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          PROJECTYML

          cat > ProjectSora2/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>$(DEVELOPMENT_LANGUAGE)</string>
              <key>CFBundleDisplayName</key>
              <string>Sora 2</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
              <key>CFBundleShortVersionString</key>
              <string>0.7</string>
              <key>CFBundleVersion</key>
              <string>7</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Выберите фото для создания видео</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>

              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconName</key>
                      <string>AppIcon</string>
                  </dict>
                  <key>CFBundleAlternateIcons</key>
                  <dict>
                      <key>NightIcon</key>
                      <dict>
                          <key>CFBundleIconFiles</key>
                          <array>
                              <string>NightIcon</string>
                          </array>
                          <key>UIPrerenderedIcon</key>
                          <false/>
                      </dict>
                      <key>GoldIcon</key>
                      <dict>
                          <key>CFBundleIconFiles</key>
                          <array>
                              <string>GoldIcon</string>
                          </array>
                          <key>UIPrerenderedIcon</key>
                          <false/>
                      </dict>
                      <key>SantaIcon</key>
                      <dict>
                          <key>CFBundleIconFiles</key>
                          <array>
                              <string>SantaIcon</string>
                          </array>
                          <key>UIPrerenderedIcon</key>
                          <false/>
                      </dict>
                  </dict>
              </dict>
          </dict>
          </plist>
          PLIST

          cat > ProjectSora2/Main.swift <<'SWIFT'
          import SwiftUI
          import PhotosUI
          import UIKit

          @main
          struct ProjectSora2App: App {
              @StateObject private var model = AppModel()

              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .environmentObject(model)
                          .preferredColorScheme(.dark)
                  }
              }
          }

          final class AppModel: ObservableObject {
              @Published var hasProfile: Bool
              @Published var username: String
              @Published var videoCount: Int
              @Published var usedPhoto: Bool
              @Published var lastPrompt: String
              @Published var selectedIcon: String

              init() {
                  let d = UserDefaults.standard
                  self.hasProfile = d.bool(forKey: "hasProfile")
                  self.username = d.string(forKey: "username") ?? ""
                  self.videoCount = d.integer(forKey: "videoCount")
                  self.usedPhoto = d.bool(forKey: "usedPhoto")
                  self.lastPrompt = d.string(forKey: "lastPrompt") ?? ""
                  self.selectedIcon = d.string(forKey: "selectedIcon") ?? "Original"
              }

              func createProfile(_ name: String) {
                  let clean = name.trimmingCharacters(in: .whitespacesAndNewlines)
                  username = clean.isEmpty ? "user_sora2" : clean
                  hasProfile = true
                  save()
              }

              func recordCreate(prompt: String, hasPhoto: Bool) {
                  videoCount += 1
                  let clean = prompt.trimmingCharacters(in: .whitespacesAndNewlines)
                  lastPrompt = clean.isEmpty ? "Новое видео Sora 2" : clean
                  if hasPhoto { usedPhoto = true }
                  save()
              }

              func chooseIcon(_ icon: String) {
                  selectedIcon = icon
                  save()
              }

              private func save() {
                  let d = UserDefaults.standard
                  d.set(hasProfile, forKey: "hasProfile")
                  d.set(username, forKey: "username")
                  d.set(videoCount, forKey: "videoCount")
                  d.set(usedPhoto, forKey: "usedPhoto")
                  d.set(lastPrompt, forKey: "lastPrompt")
                  d.set(selectedIcon, forKey: "selectedIcon")
              }

              var isWinterEvent: Bool {
                  let c = Calendar.current.dateComponents([.month, .day], from: Date())
                  guard let m = c.month, let day = c.day else { return false }
                  return m == 12 || (m == 1 && day <= 7)
              }

              var achievements: [Achievement] {
                  [
                      Achievement(
                          id: "welcome",
                          icon: "person.crop.circle.badge.checkmark",
                          title: "Добро пожаловать",
                          subtitle: "Создай локальный профиль",
                          reward: "Базовая иконка",
                          current: hasProfile ? 1 : 0,
                          target: 1
                      ),
                      Achievement(
                          id: "first",
                          icon: "sparkles",
                          title: "Первое видео",
                          subtitle: "Создай первое задание",
                          reward: "Ночная иконка",
                          current: min(videoCount, 1),
                          target: 1
                      ),
                      Achievement(
                          id: "director",
                          icon: "movieclapper.fill",
                          title: "Режиссёр",
                          subtitle: "Создай 10 заданий",
                          reward: "Золотая иконка",
                          current: min(videoCount, 10),
                          target: 10
                      ),
                      Achievement(
                          id: "photo",
                          icon: "photo.fill",
                          title: "Image to Video",
                          subtitle: "Добавь фото в создание",
                          reward: "Редкая ачивка",
                          current: usedPhoto ? 1 : 0,
                          target: 1
                      ),
                      Achievement(
                          id: "master",
                          icon: "trophy.fill",
                          title: "Sora Master",
                          subtitle: "Создай 25 заданий",
                          reward: "Мастер-статус",
                          current: min(videoCount, 25),
                          target: 25
                      ),
                      Achievement(
                          id: "winter",
                          icon: "snowflake",
                          title: "Новогоднее событие",
                          subtitle: "Открой приложение во время зимнего события",
                          reward: "Иконка Санты",
                          current: isWinterEvent ? 1 : 0,
                          target: 1
                      )
                  ]
              }

              var unlockedAchievementCount: Int {
                  achievements.filter { $0.isUnlocked }.count
              }
          }

          struct Achievement: Identifiable {
              let id: String
              let icon: String
              let title: String
              let subtitle: String
              let reward: String
              let current: Int
              let target: Int

              var isUnlocked: Bool { current >= target }
              var progress: Double {
                  target == 0 ? 1 : min(1, Double(current) / Double(target))
              }
          }

          enum RootPhase {
              case start
              case account
              case main
          }

          struct RootView: View {
              @EnvironmentObject var model: AppModel
              @State private var phase: RootPhase = .start

              var body: some View {
                  ZStack {
                      switch phase {
                      case .start:
                          StartView {
                              withAnimation(.easeInOut(duration: 0.25)) {
                                  phase = model.hasProfile ? .main : .account
                              }
                          }

                      case .account:
                          AccountView {
                              withAnimation(.easeInOut(duration: 0.25)) {
                                  phase = .main
                              }
                          }

                      case .main:
                          MainShell()
                      }
                  }
              }
          }

          // MARK: - Start

          struct StartView: View {
              let onStart: () -> Void

              var body: some View {
                  ZStack {
                      StarBackground()

                      VStack(spacing: 0) {
                          Spacer()

                          Image("AppIconPreview")
                              .resizable()
                              .scaledToFit()
                              .frame(width: 158, height: 158)
                              .clipShape(RoundedRectangle(cornerRadius: 38, style: .continuous))
                              .shadow(color: .black.opacity(0.35), radius: 18, y: 10)

                          Text("Sora 2")
                              .font(.system(size: 48, weight: .semibold, design: .rounded))
                              .foregroundStyle(.white)
                              .padding(.top, 24)

                          Spacer()

                          Button(action: onStart) {
                              Text("Старт")
                                  .font(.system(size: 21, weight: .semibold))
                                  .foregroundStyle(.black)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 62)
                                  .background(.white)
                                  .clipShape(Capsule())
                          }
                          .padding(.horizontal, 28)
                          .padding(.bottom, 42)
                      }
                  }
              }
          }

          // MARK: - Account

          struct AccountView: View {
              @EnvironmentObject var model: AppModel
              @State private var nickname = ""
              let onComplete: () -> Void

              var body: some View {
                  ZStack {
                      StarBackground()

                      VStack(spacing: 18) {
                          Spacer()

                          Image("AppIconPreview")
                              .resizable()
                              .scaledToFit()
                              .frame(width: 104, height: 104)
                              .clipShape(RoundedRectangle(cornerRadius: 26, style: .continuous))

                          Text("Создать аккаунт")
                              .font(.system(size: 32, weight: .bold))
                              .foregroundStyle(.white)

                          Text("Профиль хранится локально на этом iPhone")
                              .font(.system(size: 14, weight: .medium))
                              .foregroundStyle(.white.opacity(0.56))

                          TextField("Никнейм", text: $nickname)
                              .textInputAutocapitalization(.never)
                              .autocorrectionDisabled()
                              .padding(.horizontal, 18)
                              .frame(height: 58)
                              .background(.white.opacity(0.09))
                              .overlay {
                                  RoundedRectangle(cornerRadius: 20, style: .continuous)
                                      .stroke(.white.opacity(0.14), lineWidth: 1)
                              }
                              .clipShape(RoundedRectangle(cornerRadius: 20, style: .continuous))
                              .foregroundStyle(.white)
                              .padding(.horizontal, 28)

                          Button {
                              model.createProfile(nickname)
                              onComplete()
                          } label: {
                              Text("Создать аккаунт")
                                  .font(.system(size: 18, weight: .bold))
                                  .foregroundStyle(.black)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 58)
                                  .background(.white)
                                  .clipShape(Capsule())
                          }
                          .padding(.horizontal, 28)

                          HStack(spacing: 8) {
                              Image(systemName: "trophy.fill")
                              Text("Ачивки и иконки появятся в профиле")
                          }
                          .font(.system(size: 13, weight: .medium))
                          .foregroundStyle(.white.opacity(0.58))

                          Spacer()
                      }
                  }
              }
          }

          // MARK: - Main shell

          struct MainShell: View {
              @State private var selectedTab = 0
              @State private var showCreate = false

              var body: some View {
                  ZStack(alignment: .bottom) {
                      Group {
                          switch selectedTab {
                          case 0:
                              HomeFeedView()
                          case 1:
                              ExploreView()
                          case 3:
                              AchievementsView()
                          case 4:
                              ProfileView()
                          default:
                              HomeFeedView()
                          }
                      }
                      .padding(.bottom, 74)

                      AppTabBar(selectedTab: $selectedTab) {
                          showCreate = true
                      }
                  }
                  .ignoresSafeArea(.keyboard)
                  .sheet(isPresented: $showCreate) {
                      CreateVideoView()
                  }
              }
          }

          struct AppTabBar: View {
              @Binding var selectedTab: Int
              let create: () -> Void

              var body: some View {
                  HStack {
                      tab(0, "house.fill", "Главная")
                      Spacer()
                      tab(1, "safari.fill", "Обзор")
                      Spacer()

                      Button(action: create) {
                          ZStack {
                              RoundedRectangle(cornerRadius: 11, style: .continuous)
                                  .fill(.white)
                                  .frame(width: 58, height: 38)

                              Image(systemName: "plus")
                                  .font(.system(size: 21, weight: .bold))
                                  .foregroundStyle(.black)
                          }
                      }

                      Spacer()
                      tab(3, "trophy.fill", "Ачивки")
                      Spacer()
                      tab(4, "person.fill", "Профиль")
                  }
                  .padding(.horizontal, 17)
                  .padding(.top, 10)
                  .padding(.bottom, 12)
                  .background(.black.opacity(0.96))
              }

              private func tab(_ value: Int, _ icon: String, _ title: String) -> some View {
                  Button {
                      selectedTab = value
                  } label: {
                      VStack(spacing: 4) {
                          Image(systemName: icon)
                              .font(.system(size: 19, weight: .semibold))
                          Text(title)
                              .font(.system(size: 10, weight: .medium))
                      }
                      .foregroundStyle(selectedTab == value ? .white : .white.opacity(0.50))
                  }
              }
          }

          // MARK: - Home

          struct HomeFeedView: View {
              @EnvironmentObject var model: AppModel

              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()

                      VStack(spacing: 0) {
                          HStack(spacing: 22) {
                              Text("Подписки")
                                  .foregroundStyle(.white.opacity(0.48))

                              Text("Для вас")
                                  .fontWeight(.bold)
                                  .foregroundStyle(.white)
                                  .overlay(alignment: .bottom) {
                                      Capsule()
                                          .fill(.white)
                                          .frame(width: 30, height: 2)
                                          .offset(y: 9)
                                  }
                          }
                          .font(.system(size: 16))
                          .padding(.top, 12)

                          Spacer(minLength: 14)

                          ZStack(alignment: .bottom) {
                              RoundedRectangle(cornerRadius: 30, style: .continuous)
                                  .fill(
                                      LinearGradient(
                                          colors: [
                                              Color(red: 0.01, green: 0.08, blue: 0.17),
                                              Color(red: 0.00, green: 0.02, blue: 0.05)
                                          ],
                                          startPoint: .top,
                                          endPoint: .bottom
                                      )
                                  )
                                  .overlay {
                                      MiniStars()
                                          .clipShape(RoundedRectangle(cornerRadius: 30, style: .continuous))
                                  }

                              VStack(spacing: 14) {
                                  Spacer()

                                  Image("AppIconPreview")
                                      .resizable()
                                      .scaledToFit()
                                      .frame(width: 110, height: 110)
                                      .clipShape(RoundedRectangle(cornerRadius: 28, style: .continuous))

                                  Text("Sora 2")
                                      .font(.system(size: 36, weight: .semibold, design: .rounded))
                                      .foregroundStyle(.white)

                                  Text(model.videoCount == 0 ? "Создай первое видео через +" : model.lastPrompt)
                                      .font(.system(size: 16, weight: .medium))
                                      .foregroundStyle(.white.opacity(0.62))
                                      .multilineTextAlignment(.center)
                                      .padding(.horizontal, 38)

                                  Spacer()
                              }

                              HStack(alignment: .bottom) {
                                  VStack(alignment: .leading, spacing: 7) {
                                      Text("@\(model.username.isEmpty ? "project_sora2" : model.username)")
                                          .font(.system(size: 16, weight: .bold))

                                      Text(model.videoCount == 0
                                           ? "Твоя лента созданных видео"
                                           : "Локальное задание #\(model.videoCount)")
                                          .font(.system(size: 14))

                                      HStack(spacing: 6) {
                                          Image(systemName: "music.note")
                                          Text("Project Sora 2")
                                      }
                                      .font(.system(size: 13, weight: .medium))
                                  }
                                  .foregroundStyle(.white)

                                  Spacer()

                                  VStack(spacing: 20) {
                                      FeedAction(icon: "person.crop.circle.fill", text: "")
                                      FeedAction(icon: "heart.fill", text: "0")
                                      FeedAction(icon: "bubble.right.fill", text: "0")
                                      FeedAction(icon: "bookmark.fill", text: "")
                                      FeedAction(icon: "arrowshape.turn.up.right.fill", text: "")
                                  }
                              }
                              .padding(18)
                          }
                          .padding(.horizontal, 9)
                          .padding(.bottom, 8)
                      }
                  }
              }
          }

          struct FeedAction: View {
              let icon: String
              let text: String

              var body: some View {
                  VStack(spacing: 4) {
                      Image(systemName: icon)
                          .font(.system(size: 28, weight: .semibold))
                      if !text.isEmpty {
                          Text(text)
                              .font(.system(size: 12, weight: .semibold))
                      }
                  }
                  .foregroundStyle(.white)
              }
          }

          // MARK: - Explore

          struct ExploreView: View {
              @EnvironmentObject var model: AppModel

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [
                              Color(red: 0.005, green: 0.035, blue: 0.09),
                              .black
                          ],
                          startPoint: .top,
                          endPoint: .bottom
                      )
                      .ignoresSafeArea()

                      ScrollView(showsIndicators: false) {
                          VStack(alignment: .leading, spacing: 20) {
                              Text("Обзор")
                                  .font(.system(size: 34, weight: .bold))
                                  .foregroundStyle(.white)
                                  .padding(.top, 20)

                              if model.isWinterEvent {
                                  EventCard(
                                      title: "Новогоднее событие",
                                      subtitle: "Открыта праздничная иконка 🎅",
                                      icon: "snowflake"
                                  )
                              } else {
                                  EventCard(
                                      title: "События",
                                      subtitle: "На праздники здесь появятся временные темы и иконки",
                                      icon: "calendar"
                                  )
                              }

                              Text("Стили")
                                  .font(.system(size: 20, weight: .bold))
                                  .foregroundStyle(.white)

                              LazyVGrid(columns: [
                                  GridItem(.flexible()),
                                  GridItem(.flexible())
                              ], spacing: 12) {
                                  StyleCard(title: "Кино", icon: "film.fill")
                                  StyleCard(title: "Реализм", icon: "camera.fill")
                                  StyleCard(title: "Аниме", icon: "sparkles")
                                  StyleCard(title: "VHS", icon: "video.fill")
                                  StyleCard(title: "Хоррор", icon: "moon.stars.fill")
                                  StyleCard(title: "Трейлер", icon: "play.rectangle.fill")
                              }
                          }
                          .padding(.horizontal, 18)
                          .padding(.bottom, 30)
                      }
                  }
              }
          }

          struct EventCard: View {
              let title: String
              let subtitle: String
              let icon: String

              var body: some View {
                  HStack(spacing: 14) {
                      Image(systemName: icon)
                          .font(.system(size: 26, weight: .bold))
                          .foregroundStyle(.white)
                          .frame(width: 54, height: 54)
                          .background(.white.opacity(0.10))
                          .clipShape(RoundedRectangle(cornerRadius: 16, style: .continuous))

                      VStack(alignment: .leading, spacing: 4) {
                          Text(title)
                              .font(.system(size: 17, weight: .bold))
                              .foregroundStyle(.white)
                          Text(subtitle)
                              .font(.system(size: 13))
                              .foregroundStyle(.white.opacity(0.58))
                      }

                      Spacer()
                  }
                  .padding(15)
                  .background(.white.opacity(0.07))
                  .clipShape(RoundedRectangle(cornerRadius: 22, style: .continuous))
              }
          }

          struct StyleCard: View {
              let title: String
              let icon: String

              var body: some View {
                  VStack(alignment: .leading, spacing: 18) {
                      Image(systemName: icon)
                          .font(.system(size: 26, weight: .semibold))
                          .foregroundStyle(.white)

                      Text(title)
                          .font(.system(size: 17, weight: .bold))
                          .foregroundStyle(.white)
                  }
                  .frame(maxWidth: .infinity, minHeight: 120, alignment: .leading)
                  .padding(16)
                  .background(
                      LinearGradient(
                          colors: [.white.opacity(0.12), .white.opacity(0.045)],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                  )
                  .clipShape(RoundedRectangle(cornerRadius: 22, style: .continuous))
              }
          }

          // MARK: - Achievements

          struct AchievementsView: View {
              @EnvironmentObject var model: AppModel

              var body: some View {
                  ZStack {
                      Color(red: 0.005, green: 0.025, blue: 0.06)
                          .ignoresSafeArea()

                      ScrollView(showsIndicators: false) {
                          VStack(alignment: .leading, spacing: 14) {
                              Text("Достижения")
                                  .font(.system(size: 34, weight: .bold))
                                  .foregroundStyle(.white)
                                  .padding(.top, 20)

                              Text("\(model.unlockedAchievementCount) из \(model.achievements.count) открыто")
                                  .font(.system(size: 14, weight: .medium))
                                  .foregroundStyle(.white.opacity(0.52))
                                  .padding(.bottom, 4)

                              ForEach(model.achievements) { achievement in
                                  AchievementCard(achievement: achievement)
                              }
                          }
                          .padding(.horizontal, 18)
                          .padding(.bottom, 30)
                      }
                  }
              }
          }

          struct AchievementCard: View {
              let achievement: Achievement

              var body: some View {
                  HStack(spacing: 14) {
                      ZStack {
                          RoundedRectangle(cornerRadius: 17, style: .continuous)
                              .fill(achievement.isUnlocked ? .white.opacity(0.16) : .white.opacity(0.06))
                              .frame(width: 62, height: 62)

                          Image(systemName: achievement.isUnlocked ? achievement.icon : "lock.fill")
                              .font(.system(size: 25, weight: .bold))
                              .foregroundStyle(achievement.isUnlocked ? .white : .white.opacity(0.35))
                      }

                      VStack(alignment: .leading, spacing: 5) {
                          HStack {
                              Text(achievement.title)
                                  .font(.system(size: 17, weight: .bold))
                                  .foregroundStyle(.white)

                              if achievement.isUnlocked {
                                  Image(systemName: "checkmark.seal.fill")
                                      .foregroundStyle(.green)
                              }
                          }

                          Text(achievement.subtitle)
                              .font(.system(size: 13))
                              .foregroundStyle(.white.opacity(0.55))

                          ProgressView(
                              value: Double(achievement.current),
                              total: Double(achievement.target)
                          )
                          .tint(.white)

                          Text("Награда: \(achievement.reward)")
                              .font(.system(size: 12, weight: .medium))
                              .foregroundStyle(.white.opacity(0.44))
                      }

                      Spacer()

                      Text("\(achievement.current)/\(achievement.target)")
                          .font(.system(size: 12, weight: .semibold))
                          .foregroundStyle(.white.opacity(0.46))
                  }
                  .padding(14)
                  .background(.white.opacity(0.055))
                  .clipShape(RoundedRectangle(cornerRadius: 22, style: .continuous))
              }
          }

          // MARK: - Profile

          struct ProfileView: View {
              @EnvironmentObject var model: AppModel
              @State private var showIcons = false

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [
