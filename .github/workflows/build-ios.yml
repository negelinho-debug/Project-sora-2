                              let y = CGFloat((i * 61 + 19) % 101) / 101.0

                              Circle()
                                  .fill(.white.opacity(i % 3 == 0 ? 0.72 : 0.48))
                                  .frame(width: i % 4 == 0 ? 2 : 1, height: i % 4 == 0 ? 2 : 1)
                                  .position(x: geo.size.width * x, y: geo.size.height * y)
