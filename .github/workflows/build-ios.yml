name: Build Project Sora 2 v0.6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Create Sora 2 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ProjectSora2 ProjectSora2.xcodeproj DerivedData Payload output
          mkdir -p ProjectSora2/Resources
          mkdir -p ProjectSora2/Assets.xcassets/AppIcon.appiconset

          cat > project.yml <<'PROJECTYML'
          name: ProjectSora2

          options:
            deploymentTarget:
              iOS: "16.0"

          targets:
            ProjectSora2:
              type: application
              platform: iOS

              sources:
                - path: ProjectSora2
                  excludes:
                    - Resources

              resources:
                - path: ProjectSora2/Resources

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.projectsora2.v06
                  PRODUCT_NAME: "Sora 2"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: "Sora 2"
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Выберите фото для создания видео"
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
          PROJECTYML

          cat > ProjectSora2/Main.swift <<'SWIFT'
          import SwiftUI
          import PhotosUI

          @main
          struct ProjectSora2App: App {
              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .preferredColorScheme(.dark)
                  }
              }
          }

          struct RootView: View {
              @State private var started = false
              @State private var selectedTab = 0
              @State private var showCreate = false

              var body: some View {
                  ZStack {
                      if started {
                          FeedView(selectedTab: $selectedTab, showCreate: $showCreate)
                              .transition(.opacity)
                      } else {
                          StartView {
                              withAnimation(.easeInOut(duration: 0.25)) {
                                  started = true
                              }
                          }
                          .transition(.opacity)
                      }
                  }
                  .sheet(isPresented: $showCreate) {
                      CreateVideoView()
                  }
              }
          }

          struct StartView: View {
              let onStart: () -> Void

              var body: some View {
                  ZStack {
                      StarBackground()

                      VStack(spacing: 0) {
                          Spacer()

                          Image("soraCloud")
                              .resizable()
                              .scaledToFit()
                              .frame(width: 152, height: 152)

                          Text("Sora 2")
                              .font(.system(size: 46, weight: .semibold, design: .rounded))
                              .foregroundStyle(.white)
                              .padding(.top, 12)

                          Spacer()

                          Button(action: onStart) {
                              Text("Старт")
                                  .font(.system(size: 20, weight: .semibold))
                                  .foregroundStyle(.black)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 58)
                                  .background(.white)
                                  .clipShape(Capsule())
                          }
                          .padding(.horizontal, 28)
                          .padding(.bottom, 42)
                      }
                  }
              }
          }

          struct FeedView: View {
              @Binding var selectedTab: Int
              @Binding var showCreate: Bool

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [
                              Color(red: 0.06, green: 0.08, blue: 0.12),
                              Color(red: 0.01, green: 0.02, blue: 0.04)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                      .ignoresSafeArea()

                      VStack(spacing: 0) {
                          HStack(spacing: 22) {
                              Text("Подписки")
                                  .foregroundStyle(.white.opacity(0.55))
                                  .font(.system(size: 16, weight: .semibold))

                              Text("Для вас")
                                  .foregroundStyle(.white)
                                  .font(.system(size: 17, weight: .bold))
                                  .overlay(alignment: .bottom) {
                                      Capsule()
                                          .fill(.white)
                                          .frame(width: 28, height: 2)
                                          .offset(y: 8)
                                  }
                          }
                          .padding(.top, 12)

                          Spacer()

                          ZStack(alignment: .bottom) {
                              RoundedRectangle(cornerRadius: 30, style: .continuous)
                                  .fill(
                                      LinearGradient(
                                          colors: [
                                              Color(red: 0.12, green: 0.16, blue: 0.24),
                                              Color(red: 0.04, green: 0.05, blue: 0.08)
                                          ],
                                          startPoint: .top,
                                          endPoint: .bottom
                                      )
                                  )
                                  .overlay {
                                      StarBackground()
                                          .clipShape(RoundedRectangle(cornerRadius: 30, style: .continuous))
                                  }
                                  .overlay {
                                      VStack(spacing: 16) {
                                          Image("soraCloud")
                                              .resizable()
                                              .scaledToFit()
                                              .frame(width: 118, height: 118)

                                          Text("Sora 2")
                                              .font(.system(size: 32, weight: .semibold, design: .rounded))
                                              .foregroundStyle(.white)

                                          Text("Твоя лента созданных видео")
                                              .font(.system(size: 15, weight: .medium))
                                              .foregroundStyle(.white.opacity(0.62))
                                      }
                                  }

                              HStack(alignment: .bottom) {
                                  VStack(alignment: .leading, spacing: 8) {
                                      Text("@project_sora2")
                                          .font(.system(size: 16, weight: .bold))
                                          .foregroundStyle(.white)

                                      Text("Здесь будут появляться твои созданные видео")
                                          .font(.system(size: 14))
                                          .foregroundStyle(.white.opacity(0.9))
                                          .lineLimit(2)

                                      HStack(spacing: 6) {
                                          Image(systemName: "music.note")
                                          Text("Project Sora 2")
                                      }
                                      .font(.system(size: 13, weight: .medium))
                                      .foregroundStyle(.white.opacity(0.78))
                                  }

                                  Spacer()

                                  VStack(spacing: 20) {
                                      ActionIcon(system: "person.crop.circle.fill", text: "")
                                      ActionIcon(system: "heart.fill", text: "0")
                                      ActionIcon(system: "bubble.right.fill", text: "0")
                                      ActionIcon(system: "bookmark.fill", text: "")
                                      ActionIcon(system: "arrowshape.turn.up.right.fill", text: "")
                                  }
                              }
                              .padding(18)
                          }
                          .frame(maxHeight: .infinity)
                          .padding(.horizontal, 10)
                          .padding(.top, 18)

                          bottomBar
                      }
                  }
              }

              private var bottomBar: some View {
                  HStack {
                      BottomItem(system: "house.fill", title: "Главная", active: selectedTab == 0) {
                          selectedTab = 0
                      }

                      Spacer()

                      BottomItem(system: "safari.fill", title: "Обзор", active: selectedTab == 1) {
                          selectedTab = 1
                      }

                      Spacer()

                      Button {
                          showCreate = true
                      } label: {
                          ZStack {
                              RoundedRectangle(cornerRadius: 10, style: .continuous)
                                  .fill(.white)
                                  .frame(width: 54, height: 34)

                              Image(systemName: "plus")
                                  .font(.system(size: 20, weight: .bold))
                                  .foregroundStyle(.black)
                          }
                      }

                      Spacer()

                      BottomItem(system: "bell.fill", title: "Активность", active: selectedTab == 3) {
                          selectedTab = 3
                      }

                      Spacer()

                      BottomItem(system: "person.fill", title: "Профиль", active: selectedTab == 4) {
                          selectedTab = 4
                      }
                  }
                  .padding(.horizontal, 18)
                  .padding(.top, 10)
                  .padding(.bottom, 12)
                  .background(.black.opacity(0.94))
              }
          }

          struct ActionIcon: View {
              let system: String
              let text: String

              var body: some View {
                  VStack(spacing: 4) {
                      Image(systemName: system)
                          .font(.system(size: 29, weight: .semibold))
                          .foregroundStyle(.white)
                          .shadow(radius: 2)

                      if !text.isEmpty {
                          Text(text)
                              .font(.system(size: 12, weight: .semibold))
                              .foregroundStyle(.white)
                      }
                  }
              }
          }

          struct BottomItem: View {
              let system: String
              let title: String
              let active: Bool
              let action: () -> Void

              var body: some View {
                  Button(action: action) {
                      VStack(spacing: 3) {
                          Image(systemName: system)
                              .font(.system(size: 19, weight: .semibold))
                          Text(title)
                              .font(.system(size: 10, weight: .medium))
                      }
                      .foregroundStyle(active ? .white : .white.opacity(0.60))
                  }
              }
          }

          struct CreateVideoView: View {
              @Environment(\.dismiss) private var dismiss
              @State private var prompt = ""
              @State private var photoItem: PhotosPickerItem?
              @State private var selectedImageData: Data?
              @State private var cameoEnabled = false

              var body: some View {
                  NavigationStack {
                      ZStack {
                          Color.black.ignoresSafeArea()

                          VStack(spacing: 0) {
                              HStack {
                                  Button {
                                      dismiss()
                                  } label: {
                                      Image(systemName: "xmark")
                                          .font(.system(size: 18, weight: .bold))
                                          .foregroundStyle(.white)
                                          .frame(width: 38, height: 38)
                                          .background(.white.opacity(0.08))
                                          .clipShape(Circle())
                                  }

                                  Spacer()

                                  VStack(spacing: 1) {
                                      Text("Создать видео")
                                          .font(.system(size: 18, weight: .bold))
                                          .foregroundStyle(.white)

                                      Text("Sora 2")
                                          .font(.system(size: 12, weight: .medium))
                                          .foregroundStyle(.white.opacity(0.48))
                                  }

                                  Spacer()

                                  Color.clear.frame(width: 38, height: 38)
                              }
                              .padding(.horizontal, 16)
                              .padding(.top, 8)

                              Spacer()

                              VStack(spacing: 14) {
                                  ZStack(alignment: .topLeading) {
                                      RoundedRectangle(cornerRadius: 26, style: .continuous)
                                          .fill(Color.white.opacity(0.055))
                                          .overlay {
                                              RoundedRectangle(cornerRadius: 26, style: .continuous)
                                                  .stroke(Color.white.opacity(0.16), lineWidth: 1.2)
                                          }

                                      if prompt.isEmpty {
                                          Text("Описание нового видео…")
                                              .font(.system(size: 17))
                                              .foregroundStyle(.white.opacity(0.38))
                                              .padding(.top, 18)
                                              .padding(.leading, 18)
                                      }

                                      TextEditor(text: $prompt)
                                          .scrollContentBackground(.hidden)
                                          .background(.clear)
                                          .foregroundStyle(.white)
                                          .font(.system(size: 17))
                                          .padding(.horizontal, 12)
                                          .padding(.top, 10)
                                          .padding(.bottom, 58)

                                      HStack(spacing: 10) {
                                          PhotosPicker(selection: $photoItem, matching: .images) {
                                              HStack(spacing: 7) {
                                                  Image(systemName: "photo")
                                                  Text(selectedImageData == nil ? "Фото" : "Фото добавлено")
                                              }
                                              .font(.system(size: 14, weight: .semibold))
                                              .foregroundStyle(.white)
                                              .padding(.horizontal, 12)
                                              .frame(height: 38)
                                              .background(.white.opacity(0.09))
                                              .clipShape(Capsule())
                                          }

                                          Button {
                                              cameoEnabled.toggle()
                                          } label: {
                                              HStack(spacing: 7) {
                                                  Image(systemName: "person.2.fill")
                                                  Text("Камео")
                                              }
                                              .font(.system(size: 14, weight: .semibold))
                                              .foregroundStyle(.white)
                                              .padding(.horizontal, 12)
                                              .frame(height: 38)
                                              .background(cameoEnabled ? .white.opacity(0.20) : .white.opacity(0.09))
                                              .clipShape(Capsule())
                                          }

                                          Spacer()

                                          Image(systemName: "waveform")
                                              .font(.system(size: 17, weight: .semibold))
                                              .foregroundStyle(.white.opacity(0.70))
                                              .frame(width: 38, height: 38)
                                              .background(.white.opacity(0.09))
                                              .clipShape(Circle())
                                      }
                                      .padding(.horizontal, 14)
                                      .padding(.bottom, 12)
                                      .frame(maxHeight: .infinity, alignment: .bottom)
                                  }
                                  .frame(height: 210)

                                  HStack(spacing: 8) {
                                      Chip(text: "10 сек")
                                      Chip(text: "9:16")
                                      Chip(text: "1080p")
                                      Spacer()
                                  }

                                  Button {
                                  } label: {
                                      HStack(spacing: 9) {
                                          Image(systemName: "sparkles")
                                          Text("Создать")
                                      }
                                      .font(.system(size: 18, weight: .bold))
                                      .foregroundStyle(.black)
                                      .frame(maxWidth: .infinity)
                                      .frame(height: 56)
                                      .background(.white)
                                      .clipShape(Capsule())
                                  }
                              }
                              .padding(.horizontal, 16)
                              .padding(.bottom, 20)
                          }
                      }
                      .task(id: photoItem) {
                          if let photoItem {
                              selectedImageData = try? await photoItem.loadTransferable(type: Data.self)
                          }
                      }
                  }
              }
          }

          struct Chip: View {
              let text: String

              var body: some View {
                  Text(text)
                      .font(.system(size: 13, weight: .semibold))
                      .foregroundStyle(.white.opacity(0.9))
                      .padding(.horizontal, 11)
                      .frame(height: 34)
                      .background(.white.opacity(0.08))
                      .clipShape(Capsule())
              }
          }

          struct StarBackground: View {
              private let stars: [(CGFloat, CGFloat, CGFloat, Double)] = [
                  (0.05,0.07,1.5,0.70),(0.17,0.16,1.0,0.62),(0.29,0.09,1.7,0.75),
                  (0.44,0.19,1.1,0.60),(0.62,0.08,1.3,0.68),(0.84,0.16,1.7,0.76),
                  (0.11,0.34,1.1,0.64),(0.27,0.29,1.4,0.71),(0.48,0.38,1.0,0.55),
                  (0.70,0.31,1.6,0.73),(0.92,0.39,1.1,0.61),(0.07,0.55,1.5,0.70),
                  (0.23,0.63,1.0,0.57),(0.42,0.54,1.6,0.74),(0.65,0.62,1.2,0.65),
                  (0.88,0.57,1.0,0.56),(0.15,0.79,1.6,0.73),(0.34,0.84,1.0,0.58),
                  (0.59,0.76,1.4,0.69),(0.81,0.87,1.2,0.64),(0.95,0.74,1.0,0.57)
              ]

              var body: some View {
                  GeometryReader { geo in
                      ZStack {
                          LinearGradient(
                              colors: [
                                  Color(red: 0.005, green: 0.035, blue: 0.09),
                                  Color(red: 0.005, green: 0.075, blue: 0.17),
                                  Color(red: 0.002, green: 0.025, blue: 0.065)
                              ],
                              startPoint: .top,
                              endPoint: .bottom
                          )

                          ForEach(Array(stars.enumerated()), id: \.offset) { _, star in
                              Circle()
                                  .fill(.white.opacity(star.3))
                                  .frame(width: star.2, height: star.2)
                                  .position(
                                      x: geo.size.width * star.0,
                                      y: geo.size.height * star.1
                                  )
                          }
                      }
                      .ignoresSafeArea()
                  }
              }
          }
          SWIFT

          cat > /tmp/sora_cloud.b64 <<'ICONB64'
          
          ICONB64

          tr -d '[:space:]' < /tmp/sora_cloud.b64 | base64 --decode > ProjectSora2/Resources/soraCloud.png

          # Build a non-alpha 1024x1024 icon from the same cloud picture.
          sips -s format jpeg ProjectSora2/Resources/soraCloud.png --out /tmp/cloud.jpg >/dev/null
          sips --padToHeightWidth 1024 1024 --padColor 07152B /tmp/cloud.jpg --out /tmp/icon-square.jpg >/dev/null
          sips -s format png /tmp/icon-square.jpg --out ProjectSora2/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png >/dev/null

          cat > ProjectSora2/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          cat > ProjectSora2/Assets.xcassets/Contents.json <<'JSON'
          {
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          echo "===== FILES ====="
          find ProjectSora2 -maxdepth 4 -type f -print

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project ProjectSora2.xcodeproj -list

      - name: Build unsigned app
        run: |
          set -euo pipefail

          xcodebuild \
            -project ProjectSora2.xcodeproj \
            -scheme ProjectSora2 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild.log

      - name: Create IPA
        run: |
          set -euo pipefail

          APP="$(find "$PWD/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: built .app not found"
            exit 1
          fi

          rm -rf Payload output
          mkdir -p Payload output
          cp -R "$APP" Payload/

          /usr/bin/zip -qry output/Project-Sora-2-v0.6.ipa Payload
          unzip -t output/Project-Sora-2-v0.6.ipa
          ls -lh output/Project-Sora-2-v0.6.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Project-Sora-2-v0.6-IPA
          path: output/Project-Sora-2-v0.6.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Project-Sora-2-v0.6-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
